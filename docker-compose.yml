services:
  ingestion:
    build: ./services/ingestion
    user: "${UID}:${GID}"
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./services/ingestion:/workspace

  retrieval:
    build: ./services/retrieval
    user: "${UID}:${GID}"
    ports:
      - "127.0.0.1:8889:8888"
    volumes:
      - ./services/retrieval:/workspace
